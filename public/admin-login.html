<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录 - TavernRegister</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="layout">
        <section class="card">
            <h1>管理员登录</h1>
            <p class="subtitle">输入密码访问管理面板</p>

            <form id="login-form" novalidate>
                <label class="field">
                    <span>密码</span>
                    <input 
                        type="password" 
                        name="password" 
                        required 
                        autocomplete="current-password" 
                        placeholder="请输入管理员密码" 
                        id="password-input">
                </label>

                <button type="submit" class="primary" id="login-btn">登录</button>
            </form>

            <div id="status" role="status" aria-live="polite"></div>
            
            <p class="note">
                <a href="/">← 返回注册页面</a>
            </p>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="https://github.com/SanVenturas/Tavern-Register" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.8rem; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">
                    <svg viewBox="0 0 16 16" fill="currentColor" style="width:16px;height:16px;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    Tavern-Register
                </a>
            </div>
        </section>
    </main>
    <script>
        function setStatus(message = '', isError = false) {
            const statusElement = document.getElementById('status');
            if (!statusElement) return;
            statusElement.textContent = message;
            statusElement.className = message ? (isError ? 'status-error' : 'status-success') : '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const passwordInput = document.getElementById('password-input');
            const loginBtn = document.getElementById('login-btn');
            
            if (!form) return;

            // 自动聚焦
            if (passwordInput) {
                setTimeout(() => passwordInput.focus(), 100);
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                setStatus('');

                const formData = new FormData(form);
                const password = formData.get('password');

                if (!password) {
                    setStatus('请输入密码', true);
                    return;
                }

                // 设置加载状态
                loginBtn.disabled = true;
                loginBtn.textContent = '登录中...';
                if (passwordInput) passwordInput.disabled = true;

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'content-type': 'application/json',
                            accept: 'application/json',
                        },
                        body: JSON.stringify({ password }),
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        let errorMsg = data.message || '密码错误';
                        
                        if (data.remainingAttempts !== undefined && data.remainingAttempts > 0) {
                            errorMsg += ` (剩余 ${data.remainingAttempts} 次)`;
                        }
                        
                        if (response.status === 429 && data.lockUntil) {
                            const minutes = Math.ceil((new Date(data.lockUntil).getTime() - Date.now()) / 60000);
                            errorMsg = `尝试次数过多，${minutes} 分钟后重试`;
                        }
                        
                        setStatus(errorMsg, true);
                        
                        // 恢复状态
                        loginBtn.disabled = false;
                        loginBtn.textContent = '登录';
                        if (passwordInput) {
                            passwordInput.disabled = false;
                            passwordInput.value = '';
                            passwordInput.focus();
                        }
                        return;
                    }

                    setStatus('登录成功', false);
                    
                    // 跳转到管理员面板
                    const adminPath = data.adminPanelPath || 
                        window.location.pathname.replace(/\/login$/, '') || 
                        '/admin';
                    
                    setTimeout(() => {
                        window.location.href = adminPath;
                    }, 500);
                } catch (error) {
                    setStatus('网络错误，请重试', true);
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                    if (passwordInput) {
                        passwordInput.disabled = false;
                        passwordInput.focus();
                    }
                }
            });
        });
    </script>
</body>
</html>
