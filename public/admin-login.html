<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录 - TavernRegister</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="layout">
        <section class="card">
            <h1>管理员登录</h1>
            <p class="subtitle">输入密码访问管理面板</p>

            <form id="login-form" novalidate>
                <label class="field">
                    <span>密码</span>
                    <input 
                        type="password" 
                        name="password" 
                        required 
                        autocomplete="current-password" 
                        placeholder="请输入管理员密码" 
                        id="password-input">
                </label>

                <button type="submit" class="primary" id="login-btn">登录</button>
            </form>

            <div id="status" role="status" aria-live="polite"></div>
            
            <p class="note">
                <a href="/">← 返回注册页面</a>
            </p>
        </section>
    </main>
    <script>
        function setStatus(message = '', isError = false) {
            const statusElement = document.getElementById('status');
            if (!statusElement) return;
            statusElement.textContent = message;
            statusElement.className = message ? (isError ? 'status-error' : 'status-success') : '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const passwordInput = document.getElementById('password-input');
            const loginBtn = document.getElementById('login-btn');
            
            if (!form) return;

            // 自动聚焦
            if (passwordInput) {
                setTimeout(() => passwordInput.focus(), 100);
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                setStatus('');

                const formData = new FormData(form);
                const password = formData.get('password');

                if (!password) {
                    setStatus('请输入密码', true);
                    return;
                }

                // 设置加载状态
                loginBtn.disabled = true;
                loginBtn.textContent = '登录中...';
                if (passwordInput) passwordInput.disabled = true;

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'content-type': 'application/json',
                            accept: 'application/json',
                        },
                        body: JSON.stringify({ password }),
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        let errorMsg = data.message || '密码错误';
                        
                        if (data.remainingAttempts !== undefined && data.remainingAttempts > 0) {
                            errorMsg += ` (剩余 ${data.remainingAttempts} 次)`;
                        }
                        
                        if (response.status === 429 && data.lockUntil) {
                            const minutes = Math.ceil((new Date(data.lockUntil).getTime() - Date.now()) / 60000);
                            errorMsg = `尝试次数过多，${minutes} 分钟后重试`;
                        }
                        
                        setStatus(errorMsg, true);
                        
                        // 恢复状态
                        loginBtn.disabled = false;
                        loginBtn.textContent = '登录';
                        if (passwordInput) {
                            passwordInput.disabled = false;
                            passwordInput.value = '';
                            passwordInput.focus();
                        }
                        return;
                    }

                    setStatus('登录成功', false);
                    
                    // 跳转到管理员面板
                    const adminPath = data.adminPanelPath || 
                        window.location.pathname.replace(/\/login$/, '') || 
                        '/admin';
                    
                    setTimeout(() => {
                        window.location.href = adminPath;
                    }, 500);
                } catch (error) {
                    setStatus('网络错误，请重试', true);
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                    if (passwordInput) {
                        passwordInput.disabled = false;
                        passwordInput.focus();
                    }
                }
            });
        });
    </script>
</body>
</html>
