<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员面板 - TavernRegister</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:32px;height:32px;color:var(--accent);">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                TavernPanel
            </div>
            <nav class="sidebar-nav">
                <button class="tab active" data-tab="users">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    用户列表
                </button>
                <button class="tab" data-tab="servers">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>
                    服务器管理
                </button>
                <button class="tab" data-tab="invites">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                    邀请码管理
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logout-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    登出
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="admin-container">
                <div class="top-header">
                    <h2>控制台总览</h2>
                </div>

                <div class="stats-grid" id="stats-grid"></div>

                <div id="users-tab" class="tab-content active">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0.5rem; flex-wrap: wrap; gap: 1rem;">
                    <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <span>每页显示：</span>
                            <select id="users-limit" onchange="changeUsersPage(1)">
                                <option value="10">10</option>
                                <option value="20" selected>20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <span>同步服务器：</span>
                            <select id="users-sync-server">
                                <option value="all">全部服务器</option>
                            </select>
                        </label>
                        <button type="button" class="primary" id="sync-users-btn">同步用户</button>
                    </div>
                    <div id="users-pagination-info" style="color: rgba(240, 244, 255, 0.7);"></div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>显示名称</th>
                                <th>注册方式</th>
                                <th>服务器</th>
                                <th>邀请码</th>
                                <th>IP 地址</th>
                                <th>注册时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody"></tbody>
                    </table>
                </div>
                <div id="users-pagination" style="display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;"></div>
            </div>

            <div id="servers-tab" class="tab-content">
                <div class="create-invite-form">
                    <h3>添加服务器</h3>
                    <form id="add-server-form">
                        <div class="form-row">
                            <label class="field">
                                <span>服务器名称</span>
                                <input type="text" name="name" placeholder="例如: 美国节点" required>
                            </label>
                            <label class="field">
                                <span>服务器 URL</span>
                                <input type="url" name="url" placeholder="http://127.0.0.1:8000" required>
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field">
                                <span>管理员账号</span>
                                <input type="text" name="admin_username" required>
                            </label>
                            <label class="field">
                                <span>管理员密码</span>
                                <input type="password" name="admin_password" required>
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field" style="grid-column: 1 / -1;">
                                <span>服务器描述（可选）</span>
                                <textarea name="description" rows="2" placeholder="例如：地区、性能、适用场景等" style="width: 100%; resize: vertical;"></textarea>
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field">
                                <span>服务器提供方（可选）</span>
                                <input type="text" name="provider" placeholder="例如：某云服务商 / 个人">
                            </label>
                            <label class="field">
                                <span>维护者（可选）</span>
                                <input type="text" name="maintainer" placeholder="例如：管理员昵称">
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field">
                                <span>维护者联系方式（可选）</span>
                                <input type="text" name="contact" placeholder="例如：邮箱 / Telegram / QQ">
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field" style="grid-column: 1 / -1;">
                                <span>服务器公告（可选）</span>
                                <textarea name="announcement" rows="3" placeholder="例如：服务器维护时间、规则说明等" style="width: 100%; resize: vertical;"></textarea>
                            </label>
                        </div>
                        <fieldset style="border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 1rem;">
                            <legend style="padding: 0 0.5rem; color: rgba(240, 244, 255, 0.7);">仅同机可用配置</legend>
                            <div class="form-row">
                                <label class="field" style="grid-column: 1 / -1;">
                                    <small style="color: rgba(240, 244, 255, 0.6);">仅当注册门户与本体在同一服务器时可用；达到限额后将自动禁用账户。</small>
                                </label>
                            </div>
                            <div class="form-row">
                                <label class="field">
                                    <span>每账户空间限额（可选）</span>
                                    <input type="number" name="storageLimitValue" min="1" placeholder="例如：500">
                                </label>
                                <label class="field">
                                    <span>单位</span>
                                    <select name="storageLimitUnit">
                                        <option value="mb" selected>MB</option>
                                        <option value="gb">GB</option>
                                    </select>
                                </label>
                            </div>
                            <div class="form-row">
                                <label class="field">
                                    <span>检查间隔（分钟）</span>
                                    <input type="number" name="storageCheckIntervalMinutes" min="1" placeholder="默认 5">
                                </label>
                            </div>
                            <div class="form-row">
                                <label class="field" style="grid-column: 1 / -1;">
                                    <span>SillyTavern 数据目录（同机必填）</span>
                                    <input type="text" name="localDataRoot" placeholder="例如：/home/SillyTavern/data">
                                </label>
                            </div>
                        </fieldset>
                        <div style="display: flex; gap: 1rem;">
                            <button type="button" class="secondary" id="test-connection-btn">测试连接</button>
                            <button type="submit" class="primary">添加服务器</button>
                        </div>
                    </form>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>URL</th>
                                <th>描述</th>
                                <th>提供方</th>
                                <th>维护者</th>
                                <th>每账户限额</th>
                                <th>已注册用户</th>
                                <th>状态</th>
                                <th>注册状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="servers-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div id="invites-tab" class="tab-content">
                <div class="create-invite-form">
                    <h3>创建邀请码</h3>
                    <form id="create-invite-form">
                        <div class="form-row">
                            <label class="field">
                                <span>数量</span>
                                <input type="number" name="count" min="1" max="100" value="1" required>
                            </label>
                            <label class="field">
                                <span>最大使用次数</span>
                                <input type="number" name="maxUses" min="1" max="1000" value="1" required>
                            </label>
                            <label class="field">
                                <span>过期时间（可选）</span>
                                <input type="datetime-local" name="expiresAt" id="expiresAt-input" style="cursor: pointer;">
                            </label>
                        </div>
                        <button type="submit" class="primary">创建邀请码</button>
                    </form>
                    <div id="created-codes"></div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0.5rem; flex-wrap: wrap; gap: 1rem;">
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button type="button" class="action-btn btn-danger" id="delete-all-btn" style="display: none;" onclick="deleteAllInviteCodes()">一键删除所有邀请码</button>
                        <button type="button" class="action-btn btn-danger" id="delete-used-btn" style="display: none;" onclick="deleteUsedInviteCodes()">一键删除已使用邀请码</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="select-all-codes" onchange="toggleSelectAllCodes()">
                            <span>全选</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <span>每页显示：</span>
                            <select id="invites-limit" onchange="changeInvitesPage(1)">
                                <option value="10">10</option>
                                <option value="20" selected>20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </label>
                    </div>
                    <div id="invites-pagination-info" style="color: rgba(240, 244, 255, 0.7);"></div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 40px;">
                                    <input type="checkbox" id="select-all-header" onchange="toggleSelectAllCodes()">
                                </th>
                                <th>邀请码</th>
                                <th>状态</th>
                                <th>使用次数</th>
                                <th>最大次数</th>
                                <th>过期时间</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="invites-tbody"></tbody>
                    </table>
                </div>
                <div id="invites-pagination" style="display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;"></div>
            </div>

            <div id="status" role="status" aria-live="polite"></div>
        </section>

        <!-- Edit Server Modal -->
        <div id="edit-server-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>编辑服务器</h3>
                    <button class="close-modal" onclick="closeEditModal()">&times;</button>
                </div>
                <form id="edit-server-form">
                    <input type="hidden" name="id">
                    <div class="form-row">
                        <label class="field">
                            <span>服务器名称</span>
                            <input type="text" name="name" placeholder="例如: 美国节点" required>
                        </label>
                        <label class="field">
                            <span>服务器 URL</span>
                            <input type="url" name="url" placeholder="http://127.0.0.1:8000" required>
                        </label>
                    </div>
                    <div class="form-row">
                        <label class="field">
                            <span>管理员账号</span>
                            <input type="text" name="admin_username" required>
                        </label>
                        <label class="field">
                            <span>管理员密码</span>
                            <input type="password" name="admin_password" placeholder="留空则不修改">
                        </label>
                    </div>
                    <div class="form-row">
                        <label class="field" style="grid-column: 1 / -1;">
                            <span>服务器描述（可选）</span>
                            <textarea name="description" rows="2" placeholder="例如：地区、性能、适用场景等" style="width: 100%; resize: vertical;"></textarea>
                        </label>
                    </div>
                    <div class="form-row">
                        <label class="field">
                            <span>服务器提供方（可选）</span>
                            <input type="text" name="provider" placeholder="例如：某云服务商 / 个人">
                        </label>
                        <label class="field">
                            <span>维护者（可选）</span>
                            <input type="text" name="maintainer" placeholder="例如：管理员昵称">
                        </label>
                    </div>
                    <div class="form-row">
                        <label class="field">
                            <span>维护者联系方式（可选）</span>
                            <input type="text" name="contact" placeholder="例如：邮箱 / Telegram / QQ">
                        </label>
                    </div>
                    <div class="form-row">
                        <label class="field" style="grid-column: 1 / -1;">
                            <span>服务器公告（可选）</span>
                            <textarea name="announcement" rows="3" placeholder="例如：服务器维护时间、规则说明等" style="width: 100%; resize: vertical;"></textarea>
                        </label>
                    </div>
                    <fieldset style="border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 1rem;">
                        <legend style="padding: 0 0.5rem; color: rgba(240, 244, 255, 0.7);">仅同机可用配置</legend>
                        <div class="form-row">
                            <label class="field" style="grid-column: 1 / -1;">
                                <small style="color: rgba(240, 244, 255, 0.6);">仅当注册门户与本体在同一服务器时可用；达到限额后将自动禁用账户。</small>
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field">
                                <span>每账户空间限额（可选）</span>
                                <input type="number" name="storageLimitValue" min="1" placeholder="例如：500">
                            </label>
                            <label class="field">
                                <span>单位</span>
                                <select name="storageLimitUnit">
                                    <option value="mb" selected>MB</option>
                                    <option value="gb">GB</option>
                                </select>
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field">
                                <span>检查间隔（分钟）</span>
                                <input type="number" name="storageCheckIntervalMinutes" min="1" placeholder="默认 5">
                            </label>
                        </div>
                        <div class="form-row">
                            <label class="field" style="grid-column: 1 / -1;">
                                <span>SillyTavern 数据目录（同机必填）</span>
                                <input type="text" name="localDataRoot" placeholder="例如：/home/SillyTavern/data">
                            </label>
                        </div>
                    </fieldset>
                    <div class="form-row">
                        <label class="field" style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" name="registrationPaused" style="width: auto;">
                            <span>暂停注册（暂停后新用户无法注册此服务器，但已注册用户可以继续使用）</span>
                        </label>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="secondary" onclick="closeEditModal()">取消</button>
                        <button type="submit" class="primary">保存更改</button>
                    </div>
                </form>
            </div>
            </div>
        </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
