<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TavernRegister 账号登录</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="login.js"></script>
</head>
<body>
    <main class="layout">
        <section class="card">
            <h1>登录账号</h1>
            <p class="subtitle">欢迎回来，请登录您的账号。</p>

            <div id="oauth-providers" class="oauth-section" style="display: none;">
                <p class="oauth-title">第三方登录</p>
                <div class="oauth-buttons" id="oauth-buttons"></div>
                <div class="divider">
                    <span>或</span>
                </div>
            </div>

            <form id="login-form" novalidate>
                <label class="field">
                    <span>用户标识</span>
                    <input type="text" name="handle" maxlength="64" required autocomplete="username" placeholder="请输入您的用户标识">
                </label>

                <label class="field">
                    <span>密码</span>
                    <input type="password" name="password" maxlength="128" required autocomplete="current-password" placeholder="请输入密码">
                </label>

                <button type="submit" class="primary">登录</button>
            </form>

            <p class="note">
                还没有账号？
                <a href="/register">立即注册</a>
            </p>

            <div id="status" role="status" aria-live="polite"></div>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="https://github.com/SanVenturas/Tavern-Register" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.8rem; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">
                    <svg viewBox="0 0 16 16" fill="currentColor" style="width:16px;height:16px;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    Tavern-Register
                </a>
            </div>
        </section>
    </main>
</body>
</html>
