<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TavernRegister 账号注册</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
</head>
<body>
    <main class="layout">
        <section class="card">
            <h1>创建 SillyTavern 账号</h1>
            <p class="subtitle">请填写以下信息完成注册。</p>

            <form id="register-form" novalidate>

                <label class="field">
                    <span>显示名称</span>
                    <input type="text" name="name" maxlength="64" required autocomplete="name" placeholder="例如：test123">
                    <small class="hint">这是在 SillyTavern 中展示的名称。</small>
                </label>

                <label class="field">
                    <span>用户标识</span>
                    <input type="text" name="handle" maxlength="64" required autocomplete="username" placeholder="例如：test-123">
                    <small class="hint">将自动转换为小写短横线格式（kebab-case）例如你输入的name为“test123”，则真正登录用户标识为“test-123”。</small>
                </label>

                <label class="field">
                    <span>登录密码</span>
                    <input type="password" name="password" maxlength="128" autocomplete="new-password" placeholder="请输入密码（留空则使用默认密码 123456）">
                    <small class="hint">留空将使用默认密码 123456，登录后请第一时间修改密码。</small>
                </label>

                <label class="field">
                    <span>确认密码</span>
                    <input type="password" name="confirm" maxlength="128" autocomplete="new-password" placeholder="再次输入密码（使用默认密码可留空）">
                    <small class="hint">如果使用默认密码，此字段可留空。</small>
                </label>

                <label class="field" id="email-field" style="display: none;">
                    <span>邮箱地址 <span style="color: var(--error);">*</span></span>
                    <div class="email-input-group">
                        <input type="email" name="email" maxlength="256" autocomplete="email" placeholder="请输入邮箱地址">
                        <button type="button" id="send-code-btn" class="secondary">发送验证码</button>
                    </div>
                    <small class="hint">每个邮箱只能注册一个账号。</small>
                </label>

                <!-- 人机验证弹窗 -->
                <div id="captcha-modal" class="captcha-modal" style="display: none;">
                    <div class="captcha-overlay"></div>
                    <div class="captcha-content">
                        <div class="captcha-header">
                            <span>🔒</span>
                            <h3>人机验证</h3>
                        </div>
                        <p class="captcha-question" id="captcha-question"></p>
                        <input type="text" id="captcha-answer" class="captcha-input" placeholder="请输入答案" autocomplete="off">
                        <div class="captcha-buttons">
                            <button type="button" id="captcha-refresh" class="captcha-btn secondary">换一题</button>
                            <button type="button" id="captcha-submit" class="captcha-btn primary">确认</button>
                        </div>
                        <p class="captcha-error" id="captcha-error"></p>
                    </div>
                </div>

                

                <label class="field" id="email-code-field" style="display: none;">
                    <span>邮箱验证码 <span style="color: var(--error);">*</span></span>
                    <input type="text" name="emailCode" maxlength="6" autocomplete="off" placeholder="请输入6位验证码" style="letter-spacing: 0.2em;">
                    <small class="hint">验证码已发送至您的邮箱，有效期10分钟。</small>
                </label>

                <label class="field" id="invite-code-field" style="display: none;">
                    <span>邀请码 <span style="color: var(--error);">*</span></span>
                    <input type="text" name="inviteCode" maxlength="32" autocomplete="off" placeholder="请输入邀请码" style="text-transform: uppercase;">
                    <small class="hint">注册需要有效的邀请码。</small>
                </label>

                <button type="submit" class="primary">立即注册</button>
            </form>

            <p class="note">
                已有账号？
                <a href="/login">立即登录</a>
            </p>

            <div id="status" role="status" aria-live="polite"></div>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="https://github.com/SanVenturas/Tavern-Register" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.8rem; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">
                    <svg viewBox="0 0 16 16" fill="currentColor" style="width:16px;height:16px;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    Tavern-Register
                </a>
            </div>
        </section>
    </main>
</body>
</html>
