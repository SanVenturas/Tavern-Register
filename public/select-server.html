<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>选择服务器 - TavernRegister</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <main>
        <section class="card">
            <div class="header">
                <h1>选择服务器</h1>
                <p>请选择一个 SillyTavern 服务器以完成注册。</p>
                <p>如果使用的第三方登录的用户密码默认为123456，请登录后第一时间修改密码。</p>
            </div>

            <div id="loading" style="text-align: center; padding: 2rem;">
                正在加载可用服务器...
            </div>

            <div id="server-list" class="server-list" style="display: none;"></div>

            <div id="status" role="status" aria-live="polite"></div>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="https://github.com/SanVenturas/Tavern-Register" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.8rem; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">
                    <svg viewBox="0 0 16 16" fill="currentColor" style="width:16px;height:16px;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    Tavern-Register
                </a>
            </div>
        </section>
    </main>

    <script>
        let currentUser = null;

        // HTML 转义函数，防止 XSS 攻击
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const serverList = document.getElementById('server-list');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');

            // Check user status first
            try {
                const userRes = await fetch('/api/user/status');
                const userData = await userRes.json();
                if (userData.success && userData.loggedIn) {
                    currentUser = userData;
                    
                    // Display current user
                    const header = document.querySelector('.header');
                    const userDisplay = document.createElement('div');
                    userDisplay.className = 'user-display';
                    userDisplay.textContent = `当前用户：${currentUser.handle}`;
                    header.appendChild(userDisplay);
                }
            } catch (e) {
                console.error('Failed to check user status', e);
            }

            try {
                const response = await fetch('/api/servers/available');
                const data = await response.json();

                loading.style.display = 'none';

                if (!data.success || data.servers.length === 0) {
                    serverList.style.display = 'block';
                    serverList.innerHTML = '<div style="text-align: center; padding: 1rem;">暂无可用服务器，请联系管理员。</div>';
                    return;
                }

                serverList.style.display = 'grid';
                serverList.innerHTML = data.servers.map(server => {
                    const isBound = currentUser && currentUser.serverId === server.id;
                    const isPaused = server.registrationPaused === true;
                    const activeClass = isBound ? 'selected' : '';
                    const btnText = isBound ? '进入' : (isPaused ? '已暂停注册' : '选择');
                    const providerText = server.provider ? `提供方：${server.provider}` : '';
                    const maintainerText = server.maintainer ? `维护者：${server.maintainer}` : '';
                    const contactText = server.contact ? `联系方式：${server.contact}` : '';
                    const registeredText = typeof server.registeredUserCount === 'number'
                        ? `已注册：${server.registeredUserCount} 人`
                        : '';
                    const hasMeta = providerText || maintainerText || contactText || registeredText;
                    const canSelect = isBound || !isPaused;  // 已绑定或未暂停注册的可以操作
                    const backupActions = isBound ? `
                            <div class="server-actions">
                                <button class="action-btn" onclick="event.stopPropagation(); downloadBackup(${server.id})">下载备份</button>
                                <button class="action-btn" onclick="event.stopPropagation(); triggerBackupUpload(${server.id})">应用备份</button>
                                <input type="file" id="backup-input-${server.id}" accept=".zip" style="display:none" onchange="applyBackup(${server.id}, this.files[0])">
                            </div>
                        ` : '';
                    return `
                    <div class="server-card ${activeClass} ${!canSelect ? 'disabled' : ''}" ${canSelect && !isBound ? `onclick="handleServerClick(${server.id}, '${server.name}', ${isPaused})"` : ''} style="${!canSelect ? 'opacity: 0.6; cursor: not-allowed;' : ''}">
                        <div class="server-info">
                            <h3>${server.name} ${isBound ? '<span style="font-size:0.8em;color:#10b981">(已绑定)</span>' : ''} ${isPaused && !isBound ? '<span style="font-size:0.8em;color:#ffc107">(暂停注册)</span>' : ''}</h3>
                            <p>${server.description || '暂无描述'}</p>
                            <div class="server-meta">
                                ${providerText ? `<span>${providerText}</span>` : ''}
                                ${maintainerText ? `<span>${maintainerText}</span>` : ''}
                                ${contactText ? `<span>${contactText}</span>` : ''}
                                ${registeredText ? `<span>${registeredText}</span>` : ''}
                            </div>
                            ${server.announcement ? `
                            <div class="server-announcement">
                                <strong>公告：</strong>
                                <span class="server-announcement-content">${escapeHtml(server.announcement)}</span>
                            </div>` : ''}
                            ${isPaused && !isBound ? `
                            <div class="server-announcement" style="color: #ffc107; margin-top: 0.5rem;">
                                <strong>提示：</strong><span>该服务器已暂停注册，无法绑定新用户</span>
                            </div>` : ''}
                            ${backupActions}
                        </div>
                        <button class="select-btn" ${!canSelect ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : `onclick="handleServerClick(${server.id}, '${server.name}', ${isPaused})"`}>${btnText}</button>
                    </div>
                `}).join('');

            } catch (error) {
                loading.style.display = 'none';
                status.textContent = '加载服务器列表失败';
                status.className = 'status-error';
            }
        });

        function triggerBackupUpload(serverId) {
            const input = document.getElementById(`backup-input-${serverId}`);
            if (input) {
                input.click();
            }
        }

        async function downloadBackup(serverId) {
            const status = document.getElementById('status');
            if (!currentUser || currentUser.serverId !== serverId) {
                alert('请先绑定服务器后再下载备份。');
                return;
            }

            status.textContent = '正在生成备份...';
            status.className = '';

            try {
                const response = await fetch('/api/users/backup-download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serverId }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    status.textContent = errorData.message || '下载备份失败';
                    status.className = 'status-error';
                    return;
                }

                const blob = await response.blob();
                const disposition = response.headers.get('content-disposition') || '';
                let filename = `${currentUser.handle}-backup.zip`;
                const match = disposition.match(/filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i);
                if (match) {
                    filename = decodeURIComponent(match[1] || match[2]);
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                status.textContent = '备份下载完成';
                status.className = 'status-success';
            } catch (error) {
                status.textContent = '下载备份失败';
                status.className = 'status-error';
            }
        }

        async function applyBackup(serverId, file) {
            const status = document.getElementById('status');
            if (!file) {
                return;
            }

            if (!currentUser || currentUser.serverId !== serverId) {
                alert('请先绑定服务器后再应用备份。');
                return;
            }

            if (!confirm('确定要应用该备份吗？该操作会覆盖现有数据。')) {
                return;
            }

            status.textContent = '正在应用备份...';
            status.className = '';

            try {
                const formData = new FormData();
                formData.append('backup', file);
                formData.append('serverId', serverId);

                const response = await fetch('/api/users/backup-apply', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    status.textContent = result.message || '应用备份失败';
                    status.className = 'status-error';
                    return;
                }

                status.textContent = result.message || '备份已应用';
                status.className = 'status-success';
            } catch (error) {
                status.textContent = '应用备份失败';
                status.className = 'status-error';
            }
        }

        async function handleServerClick(serverId, serverName, isPaused) {
            const status = document.getElementById('status');
            
            if (currentUser && currentUser.serverId) {
                if (currentUser.serverId === serverId) {
                    // Already bound to this server, redirect
                    status.textContent = '正在跳转...';
                    status.className = 'status-success';
                    
                    const targetUrl = currentUser.serverUrl; 
                    if (targetUrl) {
                         window.location.href = `${targetUrl}/login`;
                    } else {
                         window.location.reload();
                    }
                    return;
                } else {
                    // Bound to another server
                    alert(`您已绑定到服务器 "${currentUser.serverName}"，无法切换到 "${serverName}"。`);
                    return;
                }
            }

            // Check if registration is paused
            if (isPaused) {
                alert(`服务器 "${serverName}" 已暂停注册，无法绑定新用户。`);
                return;
            }

            // Not bound, proceed to bind
            selectServer(serverId);
        }

        async function selectServer(serverId) {
            const status = document.getElementById('status');
            if (!confirm('确定要绑定到此服务器吗？绑定后无法自行更改。')) {
                return;
            }

            status.textContent = '正在绑定服务器...';
            status.className = '';

            try {
                const response = await fetch('/api/users/bind-server', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serverId })
                });
                const data = await response.json();

                if (data.success) {
                    status.textContent = '绑定成功！正在跳转...';
                    status.className = 'status-success';
                    setTimeout(() => {
                        window.location.href = data.loginUrl;
                    }, 1500);
                } else {
                    status.textContent = data.message || '绑定失败';
                    status.className = 'status-error';
                }
            } catch (error) {
                status.textContent = '发生错误，请重试';
                status.className = 'status-error';
            }
        }
    </script>
</body>
</html>
